# %APPDATA%\yazi\config\yazi.toml

[mgr]
ratio          = [1, 3, 4]   # parent / current / preview
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true

[preview]
wrap            = "no"
tab_size        = 4
max_width       = 600
max_height      = 900
cache_dir       = ""
image_filter    = "triangle"
image_quality   = 75
ueberzug_scale  = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = 'vim "$@"', block = true, for = "windows" },
]
open = [
  { run = 'start "" "%1"', orphan = true, for = "windows" },
]
reveal = [
  { run = 'explorer /select,"%1"', orphan = true, for = "windows" },
]
extract = [
  { run = '7z x -aoa "%1" -o"%1.extracted"', for = "windows" },
]

[open]
rules = [
  { name = "*/", use = ["edit", "open", "reveal"] },
  { mime = "text/*",  use = ["edit", "reveal"] },
  { mime = "image/*", use = ["open", "reveal"] },
  { mime = "video/*", use = ["open", "reveal"] },
  { mime = "audio/*", use = ["open", "reveal"] },
  { mime = "application/zip",       use = ["extract", "reveal"] },
  { mime = "application/x-7z-*",    use = ["extract", "reveal"] },
  { mime = "application/x-tar",     use = ["extract", "reveal"] },
  { mime = "application/gzip",      use = ["extract", "reveal"] },
  { name = "*",  use = ["open", "reveal"] },
]
